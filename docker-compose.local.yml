version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hobart_db_local
    volumes:
      - hobart_postgres_data:/var/lib/postgresql/data/
      # This line will run the dump file on first-time creation
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: hobart_web_local
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  hobart_postgres_data:
