{# Expects a variable `map_locations` to be defined in the context. #}
{# `map_locations` can be a single object or an array of objects with lat/lng properties. #}

<div id="map" style="height: 60vh; width: 100%;"></div>

<script>
    async function initMap() {
        const mapDiv = document.getElementById("map");
        if (!mapDiv || typeof mapLocations === 'undefined' || (Array.isArray(mapLocations) && mapLocations.length === 0)) {
            if (mapDiv) mapDiv.innerHTML = '<p class="text-center text-muted">Map data is not available.</p>';
            return;
        }

        const { Map } = await google.maps.importLibrary("maps");
        const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

        const isMulti = Array.isArray(mapLocations);
        const points = isMulti ? mapLocations : [mapLocations];

        const map = new Map(mapDiv, {
            zoom: 8,
            center: { lat: parseFloat(points[0].lat), lng: parseFloat(points[0].lng) },
            mapId: 'HOBART_PRIMARY_MAP' // A consistent Map ID is required for Advanced Markers
        });

        const bounds = new google.maps.LatLngBounds();

        points.forEach(point => {
            const position = { lat: parseFloat(point.lat), lng: parseFloat(point.lng) };
            
            // Create a simple blue circle for the default marker
            const markerEl = document.createElement('div');
            markerEl.style.width = '12px';
            markerEl.style.height = '12px';
            markerEl.style.backgroundColor = '#1E90FF'; // DodgerBlue
            markerEl.style.borderRadius = '50%';
            markerEl.style.border = '1px solid black';

            new AdvancedMarkerElement({
                position: position,
                map: map,
                title: point.name || 'Location',
                content: markerEl
            });
            bounds.extend(position);
        });

        if (points.length > 1) {
            map.fitBounds(bounds);
        } else {
            map.setCenter(bounds.getCenter());
            map.setZoom(15);
        }
    }
</script>

<script async src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=initMap&libraries=marker&v=beta"></script>
