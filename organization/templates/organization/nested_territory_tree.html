{% extends 'base.html' %}

{% block title %}Territory Tree Visualization{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Territory Tree Visualization</h2>

        {% if tree_names %}
        <div class="form-group mb-0" style="min-width: 250px;">
            <label for="tree-select" class="font-weight-bold">Select Hierarchy:</label>
            <select class="form-control" id="tree-select">
                {% for name in tree_names %}
                    <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        </div>
    <p>Click on nodes to expand or collapse them.</p>
    <div id="tree-container"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
    .node circle {
        stroke: steelblue;
        stroke-width: 2px;
    }

    .node text {
        font: 12px sans-serif;
        /* --- PERFORMANCE FIX --- */
        /* This CSS outline is much faster than cloning the text element */
        text-shadow: 0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff;
    }

    .link {
        fill: none;
        stroke: #ccc;
        stroke-opacity: 0.4;
        stroke-width: 1.5px;
    }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const width = 1200;
    const margin = {top: 20, right: 120, bottom: 20, left: 120};
    const dy = width / 6;
    const dx = 20;

    const treeLayout = d3.tree().nodeSize([dx, dy]);
    const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);

    const svg = d3.select("#tree-container").append("svg")
        .attr("width", width)
        .attr("height", dx)
        .attr("viewBox", [-margin.left, -margin.top, width, dx])
        .style("font", "10px sans-serif")
        .style("user-select", "none");

    const gLink = svg.append("g")
        .attr("fill", "none")
        .attr("stroke", "#555")
        .attr("stroke-opacity", 0.4)
        .attr("stroke-width", 1.5);

    const gNode = svg.append("g")
        .attr("cursor", "pointer")
        .attr("pointer-events", "all");

    let root;
    let i = 0; // Counter for node IDs
    const treeSelect = document.getElementById('tree-select');

    function loadTree(treeName) {
        // Clear the old tree
        gLink.selectAll("*").remove();
        gNode.selectAll("*").remove();

        // Fetch new root data based on the selected treeName
        d3.json(`{% url 'organization:nested_territory_json_api' %}?tree_name=${treeName}`).then(initialTreeData => {
            console.log("Initial data for " + treeName + ":", initialTreeData);

            root = d3.hierarchy(initialTreeData);
            root.x0 = dx / 2;
            root.y0 = 0;
            root.id = ++i; // Assign root ID

            if (root.children) {
                root.children.forEach(d => {
                    d.id = ++i;
                    if (d.data.hasChildren) {
                        d.children = null; // Start collapsed
                        d._children = null;
                    }
                });
            }

            update(root, null); // Pass null for the event on initial load
        });
    }

    if (treeSelect) {
        loadTree(treeSelect.value);
        treeSelect.addEventListener('change', () => {
            loadTree(treeSelect.value);
        });
    } else {
        d3.select("#tree-container").text("No territory hierarchies found.");
    }

    function update(source, event) {
        const duration = event && event.altKey ? 2500 : 250;

        const nodes = root.descendants().reverse();
        const links = root.links();

        // Compute the new tree layout.
        treeLayout(root);

        let left = root;
        let right = root;
        root.eachBefore(node => {
            if (node.x < left.x) left = node;
            if (node.x > right.x) right = node;
        });

        const height = right.x - left.x + margin.top + margin.bottom;

        const transition = svg.transition()
            .duration(duration)
            .attr("height", height)
            .attr("viewBox", [-margin.left, left.x - margin.top, width, height])
            .tween("resize", window.ResizeObserver ? null : () => () => svg.dispatch("toggle"));

        // Update the nodes…
        const node = gNode.selectAll("g")
            .data(nodes, d => d.id);

        // Enter any new nodes at the parent's previous position.
        const nodeEnter = node.enter().append("g")
            .attr("transform", d => `translate(${source.y0},${source.x0})`)
            .attr("fill-opacity", 0)
            .attr("stroke-opacity", 0)
            .on("click", (event, d) => {
                if (d.children) { // Node is expanded, collapse it
                    d._children = d.children;
                    d.children = null;
                    update(d, event);
                } else if (d._children) { // Node is collapsed, expand it
                    d.children = d._children;
                    d._children = null;
                    update(d, event);
                } else if (d.data.hasChildren) { // Node has unloaded children, fetch them
                    d3.json("{% url 'organization:nested_territory_json_api' %}?node_id=" + d.data.id).then(function(childrenData) {
                        console.log("Children data from server:", childrenData);

                        d.children = childrenData.map(childData => {
                            const childNode = d3.hierarchy(childData);
                            childNode.parent = d;
                            childNode.depth = d.depth + 1;
                            childNode.id = ++i;

                            if (childNode.data.hasChildren) {
                                childNode.children = null;
                                childNode._children = null;
                            }
                            return childNode;
                        });

                        update(d, event); // Redraw with the new children
                    });
                }
            });

        nodeEnter.append("circle")
            .attr("r", 2.5)
            .attr("fill", d => {
                if (d.children) return "#fff"; // Expanded: white fill
                if (d._children) return "#555"; // Collapsed with loaded data: dark fill
                if (d.data.hasChildren) return "steelblue"; // Collapsed with unloaded data: blue fill
                return "#fff"; // True leaf: white fill
            })
            .attr("stroke", "steelblue")
            .attr("stroke-width", 2);

        // --- PERFORMANCE FIX ---
        // Removed the slow .clone() block. The text outline is now
        // handled by the CSS `text-shadow` property.
        nodeEnter.append("text")
            .attr("dy", "0.31em")
            .attr("x", -10)
            .attr("text-anchor", "end")
            .text(d => d.data.name);

        // Transition nodes to their new position.
        node.merge(nodeEnter).transition(transition)
            .attr("transform", d => `translate(${d.y},${d.x})`)
            .attr("fill-opacity", 1)
            .attr("stroke-opacity", 1);

        // Transition exiting nodes to the parent's new position.
        node.exit().transition(transition).remove()
            .attr("transform", d => `translate(${source.y},${source.x})`)
            .attr("fill-opacity", 0)
            .attr("stroke-opacity", 0);

        // Update the links…
        const link = gLink.selectAll("path")
            .data(links, d => d.target.id);

        // Enter any new links at the parent's previous position.
        const linkEnter = link.enter().append("path")
            .attr("d", d => {
                const o = {x: source.x0, y: source.y0};
                return diagonal({source: o, target: o});
            });

        // Transition links to their new position.
        link.merge(linkEnter).transition(transition)
            .attr("d", diagonal);

        // Transition exiting nodes to the parent's new position.
        link.exit().transition(transition).remove()
            .attr("d", d => {
                const o = {x: source.x, y: source.y};
                return diagonal({source: o, target: o});
            });

        // Stash the old positions for transition.
        root.eachBefore(d => {
            d.x0 = d.x;
            d.y0 = d.y;
        });
    }
});
</script>
{% endblock %}
