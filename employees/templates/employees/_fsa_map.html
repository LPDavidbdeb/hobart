{% load static %}
<div id="fsa-map-{{ employee_pk }}" style="height: 400px; width: 100%; border-radius: 0.25rem; border: 1px solid #dee2e6;"></div>

<script>
    // Define initMap globally as it's the callback for the Google Maps API script
    window.initMap = function() {
        const mapId = 'fsa-map-{{ employee_pk }}';
        const employeePk = {{ employee_pk }};
        const geometryApiUrl = "{% url geometry_api_url pk=employee_pk %}";
        const fsaClientsApiBaseUrl = "{% url 'employees:fsa_clients_api' fsa_code='DUMMY' %}".replace('DUMMY/clients/', ''); 

        const mapElement = document.getElementById(mapId);
        if (!mapElement) {
            console.error(`Map element with ID ${mapId} not found.`);
            return;
        }

        const map = new google.maps.Map(mapElement, {
            center: { lat: 45.50, lng: -73.56 }, // Default view (Montreal)
            zoom: 10,
            mapTypeId: 'roadmap'
        });

        // Generate a consistent color for each technician
        const colors = {};
        let colorIndex = 0;
        const predefinedColors = [
            '#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e0',
            '#bcf60c', '#fabed4', '#008080', '#e6beff', '#9A6324', '#fffac8', '#800000', '#aaffc3',
            '#808000', '#ffd8b1', '#000075', '#a9a9a9', '#ffffff', '#000000'
        ];

        let defaultFsaStyle = function(feature) {
            const techId = feature.getProperty('technician_id');
            if (techId && !colors[techId]) {
                colors[techId] = predefinedColors[colorIndex % predefinedColors.length];
                colorIndex++;
            }
            const fillColor = techId ? colors[techId] : '#3388ff'; // Default blue if no techId
            return {
                fillColor: fillColor,
                strokeWeight: 1,
                strokeColor: 'white',
                fillOpacity: 0.7
            };
        };

        // Set initial style for GeoJSON features
        map.data.setStyle(defaultFsaStyle);

        // Create an info window to display feature properties
        const infoWindow = new google.maps.InfoWindow();
        
        // Array to store client markers
        let clientMarkers = [];
        let currentSelectedFsaFeature = null; // To track the currently selected FSA feature

        // Function to clear all client markers
        function clearClientMarkers() {
            for (let i = 0; i < clientMarkers.length; i++) {
                clientMarkers[i].setMap(null);
            }
            clientMarkers = [];
        }

        // Show info window on mouseover
        map.data.addListener('mouseover', function(event) {
            const feature = event.feature;
            let popupContent = `<strong>FSA:</strong> ${feature.getProperty('code')}<br>`;
            if (feature.getProperty('client_count') !== undefined) {
                popupContent += `<strong>Clients:</strong> ${feature.getProperty('client_count')}<br>`;
            }
            if (feature.getProperty('technician_name')) {
                popupContent += `<strong>Technician:</strong> ${feature.getProperty('technician_name')}`;
            }
            infoWindow.setContent(popupContent);
            infoWindow.setPosition(event.latLng);
            infoWindow.setOptions({pixelOffset: new google.maps.Size(0, -30)});
            infoWindow.open(map);
        });

        // Close info window on mouseout
        map.data.addListener('mouseout', function() {
            infoWindow.close();
        });

        // Click listener for zooming and showing clients
        map.data.addListener('click', function(event) {
            const feature = event.feature;
            const fsaCode = feature.getProperty('code');

            // 1. Reset style of previously selected FSA and set style for current FSA
            if (currentSelectedFsaFeature) {
                map.data.overrideStyle(currentSelectedFsaFeature, defaultFsaStyle(currentSelectedFsaFeature));
            }
            map.data.overrideStyle(feature, { fillOpacity: 0.0, strokeWeight: 0 }); // Make clicked FSA transparent
            currentSelectedFsaFeature = feature;

            // 2. Zoom to FSA
            if (feature.getGeometry()) {
                const bounds = new google.maps.LatLngBounds();
                feature.getGeometry().forEachLatLng(function(latlng) {
                    bounds.extend(latlng);
                });
                map.fitBounds(bounds);
            }

            // 3. Clear existing client markers
            clearClientMarkers();

            // 4. Fetch and display clients for the clicked FSA
            if (fsaCode) {
                const clientApiUrl = `${fsaClientsApiBaseUrl}${fsaCode}/clients/`;
                fetch(clientApiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.clients && data.clients.length > 0) {
                            data.clients.forEach(client => {
                                const clientLatLng = { lat: client.lat, lng: client.lng };
                                const marker = new google.maps.Marker({
                                    position: clientLatLng,
                                    map: map,
                                    title: client.name,
                                    // Use default red pin by not specifying an icon
                                });

                                // Add click listener to redirect to client detail page
                                marker.addListener('click', () => {
                                    window.location.href = client.url;
                                });

                                clientMarkers.push(marker);
                            });
                        } else {
                            console.log(`No clients found for FSA: ${fsaCode}`);
                        }
                    })
                    .catch(error => console.error(`Error fetching clients for FSA ${fsaCode}:`, error));
            }
        });


        fetch(geometryApiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(geoJsonData => {
                if (geoJsonData.features && geoJsonData.features.length > 0) {
                    map.data.addGeoJson(geoJsonData);

                    const bounds = new google.maps.LatLngBounds();
                    map.data.forEach(function(feature) {
                        if (feature.getGeometry()) {
                            feature.getGeometry().forEachLatLng(function(latlng) {
                                bounds.extend(latlng);
                            });
                        }
                    });
                    map.fitBounds(bounds);
                } else {
                    console.log('No FSA geometry data received.');
                    // Optionally set a default view or message if no data
                }
            })
            .catch(error => console.error('Error fetching FSA geometry:', error));
    };
</script>
